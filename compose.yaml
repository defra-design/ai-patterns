services:
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6380:6379'
    restart: always
    networks:
      - cdp-tenant-patterns

  ai-defra-search-frontend:
    build:
      target: development
    ports:
      - '3001:4321'
      - '9230:9229'
    links:
      - 'redis:redis'
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      # Allow container to connect to Mockoon running on host machine
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/:/home/node/src
      - ./package.json:/home/node/package.json
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
    networks:
      - cdp-tenant-patterns

networks:
  cdp-tenant-patterns:
    driver: bridge
